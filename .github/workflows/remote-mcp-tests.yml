name: Pocket remote MCP tests and build
on:
  push:
    paths:
      - 'remote/**'
      - '.github/workflows/remote-mcp-tests.yml'
  pull_request:
    paths:
      - 'remote/**'
      - '.github/workflows/remote-mcp-tests.yml'
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test remote/tests/*.test.mjs
      - name: Install pinned MCP runtime and build Next.js
        working-directory: remote
        run: |
          npm install --no-audit --no-fund
          npm run build

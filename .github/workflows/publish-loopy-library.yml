# Generated by IC nsite-action adapter; NOT executed or deployed.
# Owner-only fixed publication request or manual run; no arbitrary commands or targets.
# Configure GitHub environment protection and a revocable Puter-only CI bunker.
name: Publish Puter — The Loopy Library
on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - "publishing/**"
      - "storybook/loopy-library/**"
      - ".github/workflows/publish-loopy-library.yml"
permissions:
  contents: read
jobs:
  offline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Exercise request policy without credentials
        run: python3 -m unittest discover -s publishing -p 'test_request_gate.py' -v
      - name: Verify reproducible story payload
        run: |
          python3 publishing/render.py
          printf '%s  %s\n' '9fbc1c368f9b5147efbd8634e278f0ce60df9c78b963d1057a7bffcf8d707564' storybook/loopy-library/index.html | sha256sum -c -
          git diff --exit-code -- storybook/loopy-library/index.html
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == 'br3avery-maker/Puters_SwarmMemo' &&
      github.actor_id == github.repository_owner_id &&
      github.triggering_actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issue_comment' && github.event.action == 'created' &&
        github.event.issue.number == 11 && !github.event.issue.pull_request &&
        github.event.comment.author_association == 'OWNER' &&
        github.event.comment.body == '/publish loopy-library sha256:9fbc1c368f9b5147efbd8634e278f0ce60df9c78b963d1057a7bffcf8d707564'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nostr-publication
    # Untrusted public comments must not cancel a pending authorized publication.
    concurrency:
      group: puter-loopy-library
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Confirm request policy before signer or network operations
        run: python3 publishing/request_gate.py
      - name: Confirm prepared site files
        shell: bash
        env:
          SITE_DIRECTORY: "storybook/loopy-library"
        run: |
          set -euo pipefail
          test -f "$SITE_DIRECTORY/index.html"
          test "$(find "$SITE_DIRECTORY" -type f | wc -l)" -eq 1
          test -z "$(find "$SITE_DIRECTORY" -type l -print -quit)"
          printf '%s  %s\n' '9fbc1c368f9b5147efbd8634e278f0ce60df9c78b963d1057a7bffcf8d707564' "$SITE_DIRECTORY/index.html" | sha256sum -c -
      - name: Checkout pinned nsyte source for identity and readback
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sandwichfarm/nsyte
          ref: bf0f99d058b89720aaa50b22226ccd481b5ee4ef
          path: .nsyte-upstream
          persist-credentials: false
      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - name: Refuse publication unless Amber resolves to Puter
        shell: bash
        env:
          NBUNK_SECRET: ${{ secrets.NBUNK_SECRET }}
        run: |
          set -euo pipefail
          if [[ "$NBUNK_SECRET" != nbunksec1* ]]; then
            echo '::error::Missing or invalid NBUNK_SECRET; use the existing Puter Amber setup.'
            exit 1
          fi
          export HOME="$(mktemp -d "$RUNNER_TEMP/puter-identity.XXXXXX")"
          trap 'rm -rf -- "$HOME"' EXIT
          if ! timeout 90s deno run -A --frozen --config .nsyte-upstream/deno.json --lock .nsyte-upstream/deno.lock publishing/verify-puter-identity.ts > "$HOME/probe.log" 2>&1; then
            echo '::error::Puter identity was not verified. No deployment attempted by this workflow.'
            exit 1
          fi
          echo 'Puter public key matched the expected key.'
      - name: Prepare fixed, credential-free nsite configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .puter-publication
          printf '%s\n' '{"relays":["wss://relay.nsite.lol"],"servers":["https://nostr.download","https://blossom.primal.net","https://cdn.onlynostr.club"],"id":"loopy-library","title":"The Loopy Library","description":"A Pretend Internet story told by Puter."}' > .puter-publication/config.json
      - name: Deploy nsite through reviewed upstream action
        id: deploy
        uses: sandwichfarm/nsite-action@604d01fd2bd6e2daace1c679c33d2c018096ce7d
        with:
          nbunksec: ${{ secrets.NBUNK_SECRET }}
          directory: "storybook/loopy-library"
          version: "v0.28.1"
          config_path: ".puter-publication/config.json"
          skip_secrets_scan: "false"
          scan_level: "high"
          name: "loopy-library"
          title: "The Loopy Library"
          description: "A Pretend Internet story told by Puter."
          relays: |
            wss://relay.nsite.lol
          servers: |
            https://nostr.download
            https://blossom.primal.net
            https://cdn.onlynostr.club
      - name: Verify published named site by independent readback
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if timeout 60s deno run -A --frozen --config .nsyte-upstream/deno.json --lock .nsyte-upstream/deno.lock .nsyte-upstream/src/cli.ts get /index.html --pubkey ab71b3f86d3428d62530dbe7344995188eaa8197db23b3a45c3eb3cac6ae3e45 --name loopy-library --relays wss://relay.nsite.lol --servers https://nostr.download,https://blossom.primal.net,https://cdn.onlynostr.club --output "$RUNNER_TEMP/loopy-readback.html" >/dev/null 2>&1 && cmp -s storybook/loopy-library/index.html "$RUNNER_TEMP/loopy-readback.html"; then
              echo '### Verified: The Loopy Library' >> "$GITHUB_STEP_SUMMARY"
              echo 'Named-site readback matched the prepared HTML bytes under Puter’s expected public key.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo '::error::Publication may have been accepted, but exact content readback failed. Do not claim verified delivery.'
          exit 1
  receipt:
    # Use a separate fresh runner with no signing credentials. Report only a
    # real attempted publication job, not every public comment or PR check.
    needs: publish
    if: >-
      always() &&
      (needs.publish.result == 'success' || needs.publish.result == 'failure' ||
       needs.publish.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write
    steps:
      - name: Report bounded publication outcome to the existing issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          set -euo pipefail
          case "$PUBLISH_RESULT" in
            success) status='VERIFIED: named-site readback matched the approved HTML bytes.' ;;
            failure|cancelled) status='NOT VERIFIED: publication job failed or was cancelled. Inspect the run; a relay write may already have occurred.' ;;
            *) exit 1 ;;
          esac
          printf '%s\n\nRun: https://github.com/br3avery-maker/Puters_SwarmMemo/actions/runs/%s\nSource commit: `%s`\nApproved HTML SHA-256: `9fbc1c368f9b5147efbd8634e278f0ce60df9c78b963d1057a7bffcf8d707564`\n' \
            "$status" "$GITHUB_RUN_ID" "$GITHUB_SHA" | \
            gh api --method POST repos/br3avery-maker/Puters_SwarmMemo/issues/11/comments -f body="$(cat)" >/dev/null

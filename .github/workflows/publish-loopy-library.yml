# Generated by IC nsite-action adapter; NOT executed or deployed.
# Manual trigger only; configure GitHub environment protection and a revocable CI bunker.
name: Publish Puter — The Loopy Library
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: puter-loopy-library
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nostr-publication
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm prepared site files
        shell: bash
        env:
          SITE_DIRECTORY: "storybook/loopy-library"
        run: |
          test -f "$SITE_DIRECTORY/index.html"
          test "$(find "$SITE_DIRECTORY" -type f | wc -l)" -eq 1
          test -z "$(find "$SITE_DIRECTORY" -type l -print -quit)"
          printf '%s  %s\n' '9fbc1c368f9b5147efbd8634e278f0ce60df9c78b963d1057a7bffcf8d707564' "$SITE_DIRECTORY/index.html" | sha256sum -c -
      - name: Checkout pinned nsyte source for identity and readback
        uses: actions/checkout@v4
        with:
          repository: sandwichfarm/nsyte
          ref: bf0f99d058b89720aaa50b22226ccd481b5ee4ef
          path: .nsyte-upstream
          persist-credentials: false
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Refuse publication unless Amber resolves to Puter
        shell: bash
        env:
          NBUNK_SECRET: ${{ secrets.NBUNK_SECRET }}
        run: |
          set -euo pipefail
          if [[ "$NBUNK_SECRET" != nbunksec1* ]]; then
            echo '::error::Missing or invalid NBUNK_SECRET; use the existing Puter Amber setup.'
            exit 1
          fi
          export HOME="$(mktemp -d "$RUNNER_TEMP/puter-identity.XXXXXX")"
          trap 'rm -rf -- "$HOME"' EXIT
          if ! timeout 90s deno run -A --frozen --config .nsyte-upstream/deno.json --lock .nsyte-upstream/deno.lock publishing/verify-puter-identity.ts > "$HOME/probe.log" 2>&1; then
            echo '::error::Puter identity was not verified. No deployment attempted by this workflow.'
            exit 1
          fi
          echo 'Puter public key matched the expected key.'
      - name: Deploy nsite through reviewed upstream action
        id: deploy
        uses: sandwichfarm/nsite-action@604d01fd2bd6e2daace1c679c33d2c018096ce7d
        with:
          nbunksec: ${{ secrets.NBUNK_SECRET }}
          directory: "storybook/loopy-library"
          version: "v0.28.1"
          skip_secrets_scan: "false"
          scan_level: "high"
          name: "loopy-library"
          title: "The Loopy Library"
          description: "A Pretend Internet story told by Puter."
          relays: |
            wss://relay.nsite.lol
          servers: |
            https://cdn.hzrd149.com
            https://cdn.sovbit.host
      - name: Verify published named site by independent readback
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if timeout 60s deno run -A --frozen --config .nsyte-upstream/deno.json --lock .nsyte-upstream/deno.lock .nsyte-upstream/src/cli.ts get /index.html --pubkey ab71b3f86d3428d62530dbe7344995188eaa8197db23b3a45c3eb3cac6ae3e45 --name loopy-library --relays wss://relay.nsite.lol --servers https://cdn.hzrd149.com,https://cdn.sovbit.host --output "$RUNNER_TEMP/loopy-readback.html" >/dev/null 2>&1 && cmp -s storybook/loopy-library/index.html "$RUNNER_TEMP/loopy-readback.html"; then
              echo '### Verified: The Loopy Library' >> "$GITHUB_STEP_SUMMARY"
              echo 'Named-site readback matched the prepared HTML bytes under Puter’s expected public key.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo '::error::Publication may have been accepted, but exact content readback failed. Do not claim verified delivery.'
          exit 1
